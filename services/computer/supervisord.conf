[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:seed-workspace]
command=/usr/local/bin/seed-workspace.sh
autostart=true
autorestart=false
startsecs=0
startretries=1
exitcodes=0
priority=5
stdout_logfile=/var/log/supervisor/seed-workspace.log
stderr_logfile=/var/log/supervisor/seed-workspace.err

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1366x768x24 -ac +extension RANDR
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:xfce]
command=/usr/bin/xfce4-session
directory=/workspace
user=compuser
environment=DISPLAY=":1",HOME="/workspace",USER="compuser",XDG_RUNTIME_DIR="/tmp/runtime-compuser",XDG_CONFIG_HOME="/workspace/.config",XDG_CACHE_HOME="/workspace/.cache",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-compuser/bus"
autostart=true
autorestart=true
priority=20
startsecs=2
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.err

[program:x11vnc]
command=/usr/local/bin/start-x11vnc.sh
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:chrome]
command=/usr/local/bin/start-chrome.sh
user=compuser
environment=DISPLAY=":1",HOME="/workspace",USER="compuser",XDG_RUNTIME_DIR="/tmp/runtime-compuser"
autostart=true
autorestart=true
priority=50
startsecs=2
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err

[program:agent]
command=/usr/bin/node /opt/computer-agent/server.js
directory=/opt/computer-agent
user=compuser
environment=DISPLAY=":1",HOME="/workspace",USER="compuser",COMPUTER_WORKSPACE_ROOT="/workspace",COMPUTER_AGENT_BIND="0.0.0.0",COMPUTER_AGENT_PORT="8080"
autostart=true
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent.err
