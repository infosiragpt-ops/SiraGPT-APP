[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1366x768x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:session-dbus]
command=/usr/bin/dbus-daemon --session --address=unix:path=/tmp/runtime-compuser/bus --nofork --nopidfile
environment=HOME="/workspace",USER="compuser",XDG_RUNTIME_DIR="/tmp/runtime-compuser",DISPLAY=":1"
autorestart=true
priority=18
stdout_logfile=/var/log/supervisor/session-dbus.log
stderr_logfile=/var/log/supervisor/session-dbus.err

[program:xfce4]
command=/usr/bin/xfce4-session
environment=DISPLAY=":1",HOME="/workspace",USER="compuser",XDG_RUNTIME_DIR="/tmp/runtime-compuser",DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/runtime-compuser/bus"
directory=/workspace
autorestart=true
priority=20
startsecs=2
stdout_logfile=/var/log/supervisor/xfce.log
stderr_logfile=/var/log/supervisor/xfce.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw -listen 127.0.0.1 -xkb
autorestart=true
priority=30
startretries=20
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:chrome]
command=/opt/agent/start-chrome.sh
environment=DISPLAY=":1",HOME="/workspace",USER="compuser"
directory=/workspace
autorestart=true
priority=50
startsecs=3
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err

[program:agent]
command=/usr/bin/node /opt/agent/server.js
environment=DISPLAY=":1",HOME="/workspace",USER="compuser",PORT="8080",HOST="0.0.0.0",INPUT_BIN="/usr/bin/xdotool",SCREEN_BIN="/usr/bin/scrot",CDP_PORT="9222"
directory=/opt/agent
autorestart=true
priority=60
stdout_logfile=/var/log/supervisor/agent.log
stderr_logfile=/var/log/supervisor/agent.err
