services:
  db:
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-127.0.0.1:5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT_EXTERNAL:-127.0.0.1:6379}:6379"

  backend:
    user: "0:0"
    command:
      - sh
      - -c
      - |
        command -v docker >/dev/null 2>&1 || apk add --no-cache docker-cli || true
        if [ "$$SKIP_MIGRATIONS" != "1" ]; then
          npx prisma migrate deploy --schema=prisma/schema.prisma
        fi
        exec node index.js
    ports:
      - "${BACKEND_PORT_EXTERNAL:-127.0.0.1:5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siragpt}"
      PRISMA_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-siragpt}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      CEREBRAS_BASE_URL: "${CEREBRAS_BASE_URL:-}"
      FREE_IA_MODEL_ID: "${FREE_IA_MODEL_ID:-}"
      FREE_IA_DISPLAY_NAME: "${FREE_IA_DISPLAY_NAME:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SOCIAL_INSTAGRAM_CLIENT_ID: "${SOCIAL_INSTAGRAM_CLIENT_ID:-}"
      SOCIAL_INSTAGRAM_CLIENT_SECRET: "${SOCIAL_INSTAGRAM_CLIENT_SECRET:-}"
      SOCIAL_INSTAGRAM_SCOPES: "${SOCIAL_INSTAGRAM_SCOPES:-instagram_basic,instagram_content_publish,pages_show_list,pages_read_engagement}"
      SOCIAL_YOUTUBE_CLIENT_ID: "${SOCIAL_YOUTUBE_CLIENT_ID:-}"
      SOCIAL_YOUTUBE_CLIENT_SECRET: "${SOCIAL_YOUTUBE_CLIENT_SECRET:-}"
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"
      SOCIAL_YOUTUBE_SCOPES: "${SOCIAL_YOUTUBE_SCOPES:-https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly}"
      SOCIAL_WHATSAPP_CLIENT_ID: "${SOCIAL_WHATSAPP_CLIENT_ID:-}"
      SOCIAL_WHATSAPP_CLIENT_SECRET: "${SOCIAL_WHATSAPP_CLIENT_SECRET:-}"
      SOCIAL_WHATSAPP_SCOPES: "${SOCIAL_WHATSAPP_SCOPES:-whatsapp_business_management,whatsapp_business_messaging,business_management}"
      FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
      FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
      META_APP_ID: "${META_APP_ID:-}"
      META_APP_SECRET: "${META_APP_SECRET:-}"
      FRONTEND_URL: "${FRONTEND_URL:-http://62.72.11.231}"
      RATE_LIMIT_STORE: "${RATE_LIMIT_STORE:-redis}"
      DEPLOYMENTS_V2: "${DEPLOYMENTS_V2:-false}"
      SKIP_MIGRATIONS: "${SKIP_MIGRATIONS:-1}"
      GOOGLE_AUTH_BASE_URL: "${GOOGLE_AUTH_BASE_URL:-https://siragpt.com}"
      GOOGLE_AUTH_URI: "${GOOGLE_AUTH_URI:-https://siragpt.com/api/auth/google/callback}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-https://siragpt.com/api/auth/gmail/callback}"
      GOOGLE_REDIRECT_CALENDAR_DRIVE_URI: "${GOOGLE_REDIRECT_CALENDAR_DRIVE_URI:-https://siragpt.com/api/auth/google-services/callback}"
      PUBLIC_API_URL: "${PUBLIC_API_URL:-https://siragpt.com}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-https://siragpt.com}"
      CODE_HOST_RUNNER: "${CODE_HOST_RUNNER:-false}"
      CODE_HOST_RUNNER_ALLOWED_USER_IDS: "${CODE_HOST_RUNNER_ALLOWED_USER_IDS:-}"
      ENABLE_CROSS_CHAT_RECALL: "${ENABLE_CROSS_CHAT_RECALL:-false}"
      SIRAGPT_SANDBOX_RUNTIME: "${SIRAGPT_SANDBOX_RUNTIME:-runsc}"
      VISIBLE_MODELS_ALLOWLIST: "${VISIBLE_MODELS_ALLOWLIST:-deepseek-v4-flash,deepseek-v4-pro}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      FAL_KEY: "${FAL_KEY:-${FAL_API_KEY:-}}"
      FAL_API_KEY: "${FAL_API_KEY:-${FAL_KEY:-}}"
      FAL_KEY_ID: "${FAL_KEY_ID:-}"
      FAL_KEY_SECRET: "${FAL_KEY_SECRET:-}"
      SIRAGPT_AGENT_RUNNER_MODEL: "${SIRAGPT_AGENT_RUNNER_MODEL:-deepseek-v4-flash}"
      SIRAGPT_DOC_AGENT_MODEL: "${SIRAGPT_DOC_AGENT_MODEL:-deepseek-v4-flash}"
      SIRAGPT_AGENT_RUNNER_MAX_TOKENS: "${SIRAGPT_AGENT_RUNNER_MAX_TOKENS:-1500}"
      SIRAGPT_AGENT_SKILLS: "${SIRAGPT_AGENT_SKILLS:-1}"
      SIRAGPT_AGENT_SKILLS_DIRS: "${SIRAGPT_AGENT_SKILLS_DIRS:-/app/src/skills}"
      SIRAGPT_AGENT_MEMORY: "${SIRAGPT_AGENT_MEMORY:-1}"
      SIRAGPT_AGENT_COMPUTER: "${SIRAGPT_AGENT_COMPUTER:-1}"
      NEXT_PUBLIC_AGENT_COMPUTER: "${NEXT_PUBLIC_AGENT_COMPUTER:-1}"
      AGENT_COMPUTER_ORCHESTRATOR_URL: "${AGENT_COMPUTER_ORCHESTRATOR_URL:-http://siragpt-computer-orchestrator:8090}"
      AGENT_COMPUTER_OWNER_USER_IDS: "${AGENT_COMPUTER_OWNER_USER_IDS:-cmqcv09q10000qu01lxftg1r7}"
      AGENT_COMPUTER_OWNER_SLUG: "${AGENT_COMPUTER_OWNER_SLUG:-luis}"
      AGENT_COMPUTER_DEFAULT_USER: "${AGENT_COMPUTER_DEFAULT_USER:-luis}"
      DOC_CONTENT_PROVIDER: "${DOC_CONTENT_PROVIDER:-DeepSeek}"
      FALLBACK_MODELS: "${FALLBACK_MODELS:-deepseek-v4-flash,deepseek-v4-pro}"
      GEMA4_MODEL_ID: "${GEMA4_MODEL_ID:-deepseek-v4-flash}"
      GEMA4_PROVIDER: "${GEMA4_PROVIDER:-DeepSeek}"
      GEMA4_DISPLAY_NAME: "${GEMA4_DISPLAY_NAME:-DeepSeek V4 Flash}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      FEATURE_DOC_ENGINE: "1"
