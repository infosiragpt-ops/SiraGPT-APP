  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api}"
        NEXT_PUBLIC_URL: "${NEXT_PUBLIC_URL:-https://siragpt.com}"
        NEXT_PUBLIC_APP_NAME: "${NEXT_PUBLIC_APP_NAME:-siraGPT}"
        NEXT_PUBLIC_APP_DESCRIPTION: "${NEXT_PUBLIC_APP_DESCRIPTION:-Multi-LLM AI Platform}"
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: "${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}"
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
    ports:
      - "${FRONTEND_PORT_EXTERNAL:-127.0.0.1:3000}:3000"
    environment:
      BACKEND_INTERNAL_URL: "http://backend:5000"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-/api}"
      NEXT_PUBLIC_URL: "${NEXT_PUBLIC_URL:-https://siragpt.com}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - dept_os
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scheduler_data:
  caddy_data:
  caddy_config:

networks:
  dept_os:
    name: siragpt_dept_os
    external: true
