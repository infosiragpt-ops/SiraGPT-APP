name: Promote main to production

# Pushes to main become production candidates only after CI passes for the
# exact main commit. The promotion itself is fast-forward-only, so production
# history cannot be rewritten or silently merged by automation.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Current main SHA to promote; defaults to origin/main'
        required: false
        type: string

concurrency:
  group: promote-main-to-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Fast-forward production-main to green main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production-main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve green main target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: |
          set -euo pipefail
          git fetch origin main production-main

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            if [[ "${WORKFLOW_RUN_BRANCH}" != "main" ||
                  "${WORKFLOW_RUN_EVENT}" != "push" ||
                  "${WORKFLOW_RUN_CONCLUSION}" != "success" ]]; then
              echo "::error::Automatic promotion requires a successful push CI run on main"
              exit 1
            fi
            TARGET_SHA="${WORKFLOW_RUN_SHA}"
          else
            TARGET_SHA="${REQUESTED_SHA:-$(git rev-parse origin/main)}"
          fi

          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-character Git commit SHA"
            exit 1
          fi
          TARGET_SHA="${TARGET_SHA,,}"
          git cat-file -e "${TARGET_SHA}^{commit}"

          MAIN_HEAD="$(git rev-parse origin/main | tr '[:upper:]' '[:lower:]')"
          PROD_HEAD="$(git rev-parse origin/production-main | tr '[:upper:]' '[:lower:]')"
          if [[ "${TARGET_SHA}" != "${MAIN_HEAD}" ]]; then
            echo "::error::Refusing stale promotion: target=${TARGET_SHA} current_main=${MAIN_HEAD}"
            exit 1
          fi

          SUCCESSFUL_MAIN_PUSH_RUNS="$(gh run list --workflow CI --branch main --commit "${TARGET_SHA}" --limit 20 \
            --json status,conclusion,event \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success" and .event == "push")] | length')"
          if [[ "${SUCCESSFUL_MAIN_PUSH_RUNS}" -lt 1 ]]; then
            echo "::error::Target ${TARGET_SHA} has no successful push CI run on main"
            exit 1
          fi

          if [[ "${TARGET_SHA}" == "${PROD_HEAD}" ]]; then
            echo "::notice::production-main is already at ${TARGET_SHA}"
            echo "promote=false" >> "${GITHUB_OUTPUT}"
            echo "sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/production-main "${TARGET_SHA}"; then
            echo "::error::main and production-main have diverged. Reconcile production-main into main before automatic production promotion."
            echo "::error::production-main=${PROD_HEAD} main=${MAIN_HEAD}"
            exit 1
          fi

          echo "promote=true" >> "${GITHUB_OUTPUT}"
          echo "sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Promote main to production-main
        if: steps.target.outputs.promote == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git push origin "${TARGET_SHA}:refs/heads/production-main"
          echo "::notice::Promoted main ${TARGET_SHA} to production-main. CI on production-main will gate the production deploy."
