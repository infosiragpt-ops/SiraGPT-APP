name: Publish production (Lenovo)

# Continuous deployment for siragpt.com.
#
# Every commit that lands on production-main (PR squash-merge, CI-gated by
# branch protection) is published by the self-hosted runner installed on
# the Lenovo (deploy/lenovo-runner). The job reuses the reviewed
# /home/user/deployments/iliagpt/publish.sh with ALL of its gates:
#   · CI green for the exact tree being published: either the PR run whose
#     head has the IDENTICAL git tree and already contains the previous
#     production-main (squash of an up-to-date PR), or — otherwise — the push
#     CI for the exact merged SHA (waited for below)
#   · clean checkout, fast-forward only (live must be an ancestor of target)
#   · no schema/migration diffs (the script refuses them)
#   · health baseline before, atomic activation, rollback on failure
# It never touches .env secrets, DNS, volumes or the database.
#
# Manual use: "Run workflow" with an optional target SHA (defaults to the
# branch head). The job is a no-op when the target is already live.
on:
  push:
    branches: [production-main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full production-main commit to publish (defaults to the branch head)'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  # Read-only: find the merged PR of a commit to reuse its CI result when the
  # published tree is byte-identical to the tree that PR's CI tested.
  pull-requests: read

# One publication at a time; never cancel a running publish.
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to siragpt.com
    runs-on: [self-hosted, linux, siragpt-lenovo]
    timeout-minutes: 90
    env:
      REPO: /home/user/SiraGPT-APP
      PUBLISH: /home/user/deployments/iliagpt/publish.sh
      ORIGIN: https://siragpt.com
    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          target="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full lowercase commit SHA is required"; exit 1; }
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Target: $target"

      - name: Confirm CI for the exact tree (PR run on the identical tree, else push CI)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          api() {
            curl -fsS --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"
          }
          # Fast path. A squash merge of a PR that already contains the previous
          # production-main produces EXACTLY the PR head's tree, and every CI run
          # on that head tested that tree (merge of an older production-main
          # into a head that already contains it). Accept only when all hold:
          #   1. the merged PR's final head has the same git tree as TARGET;
          #   2. TARGET's parent (production-main before the merge) is an
          #      ancestor of that head (compare status ahead/identical);
          #   3. the newest completed CI run for that head concluded success.
          # Anything else falls through to waiting for the push CI (as before).
          pr_ci_verified() {
            local target_commit target_tree parent prs pr head head_tree status state
            target_commit=$(api "git/commits/${TARGET}") || return 1
            target_tree=$(jq -r '.tree.sha' <<<"$target_commit")
            parent=$(jq -r '.parents[0].sha // empty' <<<"$target_commit")
            [[ "$target_tree" =~ ^[0-9a-f]{40}$ && "$parent" =~ ^[0-9a-f]{40}$ ]] || return 1
            prs=$(api "commits/${TARGET}/pulls") || return 1
            while read -r pr head; do
              [[ "$pr" =~ ^[0-9]+$ && "$head" =~ ^[0-9a-f]{40}$ ]] || continue
              head_tree=$(api "git/commits/${head}" | jq -r '.tree.sha') || continue
              if [[ "$head_tree" != "$target_tree" ]]; then
                echo "PR #$pr: head tree differs from $TARGET (merged behind production-main) — push CI required"; continue
              fi
              status=$(api "compare/${parent}...${head}" | jq -r '.status') || continue
              if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
                echo "PR #$pr: head does not contain production-main@${parent:0:9} ($status) — push CI required"; continue
              fi
              state=$(api "actions/workflows/ci.yml/runs?event=pull_request&head_sha=${head}&per_page=20" \
                | jq -r '[.workflow_runs[]? | select(.status=="completed")] | sort_by(.run_number) | last | .conclusion // "none"') || continue
              if [[ "$state" != "success" ]]; then
                echo "PR #$pr: newest completed CI on its head is '$state' — push CI required"; continue
              fi
              echo "Tree of $TARGET already passed CI on PR #$pr (head ${head:0:9}, identical tree, contains production-main@${parent:0:9})"
              printf 'CI: identical tree verified on PR #%s (no push-CI wait)\n' "$pr" >> "$GITHUB_STEP_SUMMARY"
              return 0
            done < <(jq -r '.[] | select(.merged_at != null) | "\(.number) \(.head.sha)"' <<<"$prs")
            return 1
          }
          for attempt in $(seq 1 100); do
            # The commit↔PR association can lag a few seconds after the merge.
            if [ "$attempt" -le 6 ] && pr_ci_verified; then exit 0; fi
            runs=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=production-main&event=push&head_sha=${TARGET}&per_page=10" || echo '{}')
            state=$(jq -r --arg sha "$TARGET" '[.workflow_runs[]? | select(.head_sha==$sha)] | sort_by(.run_number) | last | "\(.status)/\(.conclusion)"' <<<"$runs")
            case "$state" in
              completed/success) echo "CI push run for $TARGET is green"; exit 0 ;;
              completed/*) echo "::error::CI push run for $TARGET concluded '${state#completed/}' — not publishing"; exit 1 ;;
              *) echo "CI for $TARGET: $state (attempt $attempt/100, waiting 30s)"; sleep 30 ;;
            esac
          done
          echo "::error::Timed out waiting for CI on $TARGET"; exit 1

      - name: Read live release
        id: live
        shell: bash
        run: |
          set -euo pipefail
          live=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$ORIGIN/api/version" | jq -r '.commit')
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not read the live commit from $ORIGIN/api/version"; exit 1; }
          echo "sha=$live" >> "$GITHUB_OUTPUT"
          echo "Live: $live"

      - name: Already live
        if: steps.live.outputs.sha == steps.target.outputs.sha
        shell: bash
        run: |
          echo "::notice::${{ steps.target.outputs.sha }} is already the live release — nothing to publish"
          printf 'Already live: `%s`\n' "${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward the Lenovo checkout to the target
        if: steps.live.outputs.sha != steps.target.outputs.sha
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.sha }}
          LIVE: ${{ steps.live.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$REPO"
          git fetch --no-tags origin production-main
          [[ -z "$(git status --porcelain)" ]] || { echo "::error::Lenovo checkout is dirty; refusing to publish"; exit 1; }
          git merge-base --is-ancestor "$TARGET" refs/remotes/origin/production-main \
            || { echo "::error::Target is not in production-main"; exit 1; }
          git merge-base --is-ancestor "$LIVE" "$TARGET" \
            || { echo "::error::Live release $LIVE is not an ancestor of $TARGET (no fast-forward); publish manually"; exit 1; }
          git checkout -q -B deploy-from-github "$TARGET"
          echo "Checkout at $(git rev-parse HEAD)"

      - name: Publish (reviewed publish.sh)
        if: steps.live.outputs.sha != steps.target.outputs.sha
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.sha }}
          LIVE: ${{ steps.live.outputs.sha }}
        # publish.sh prints only summary lines; detailed build output stays
        # private on the Lenovo under deployments/iliagpt/backups/reviewed-*.
        run: |
          set -euo pipefail
          "$PUBLISH" "$TARGET" "$LIVE"

      - name: Verify public release
        if: steps.live.outputs.sha != steps.target.outputs.sha
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm --pull missing \
            -v "$REPO/scripts/verify-lenovo-release.cjs:/verify.cjs:ro" \
            node:22-alpine node /verify.cjs "$TARGET"
          printf 'Published and verified: `%s`\n' "$TARGET" >> "$GITHUB_STEP_SUMMARY"
