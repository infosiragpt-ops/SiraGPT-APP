name: Volumes backup · weekly tar → S3

# Weekly tar of the user-data Docker volumes (uploads, projects,
# published sites) uploaded to the same S3-compatible bucket as the DB
# backup workflow. Runs Sundays 04:00 UTC, after the daily DB backup.
#
# Manual replay: trigger via the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

# Only one volumes backup run at a time — avoids racing on bandwidth
# and double-writing to S3.
concurrency:
  group: volumes-backup
  cancel-in-progress: false

jobs:
  backup-volumes:
    name: tar volumes → S3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tar volumes on VPS and upload to S3
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 45m
          envs: BACKUP_BUCKET,BACKUP_ACCESS_KEY_ID,BACKUP_SECRET_ACCESS_KEY,BACKUP_S3_ENDPOINT,BACKUP_S3_REGION
          script: |
            set -euo pipefail

            if ! command -v aws >/dev/null 2>&1; then
              echo "Installing awscli…"
              apt-get update -y && apt-get install -y --no-install-recommends awscli
            fi

            if [[ -z "${BACKUP_BUCKET:-}" || -z "${BACKUP_ACCESS_KEY_ID:-}" || -z "${BACKUP_SECRET_ACCESS_KEY:-}" ]]; then
              echo "::notice::BACKUP_BUCKET / BACKUP_ACCESS_KEY_ID / BACKUP_SECRET_ACCESS_KEY are not fully configured; skipping volumes upload."
              exit 0
            fi

            export AWS_ACCESS_KEY_ID="${BACKUP_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${BACKUP_SECRET_ACCESS_KEY}"
            AWS_ARGS=()
            if [[ -n "${BACKUP_S3_ENDPOINT:-}" ]]; then
              AWS_ARGS+=(--endpoint-url "${BACKUP_S3_ENDPOINT}")
            fi
            if [[ -n "${BACKUP_S3_REGION:-}" ]]; then
              AWS_ARGS+=(--region "${BACKUP_S3_REGION}")
            fi

            STAMP="$(date -u +%Y%m%d)"
            OUT_DIR=/opt/siragpt/backups/volumes
            mkdir -p "${OUT_DIR}"

            tar_volume() {
              local volume="$1"
              local label="$2"
              local out="${OUT_DIR}/siraGPT_${label}_${STAMP}.tar.gz"
              echo "Taring volume ${volume} -> ${out}"
              docker run --rm -v "${volume}:/src:ro" -v "${OUT_DIR}:/dst" alpine \
                sh -c "cd /src && tar czf /dst/$(basename "${out}") ."
              gzip -t "${out}"
              sha256sum "${out}" > "${out}.sha256"
              test -s "${out}.sha256"
            }

            tar_volume siragpt_uploads_data uploads
            tar_volume siragpt_projects_data projects
            tar_volume siragpt_published_sites published

            aws "${AWS_ARGS[@]}" s3 cp "${OUT_DIR}/" "s3://${BACKUP_BUCKET}/volumes/" \
              --recursive --exclude "*" --include "siraGPT_*_${STAMP}.tar.gz" --include "siraGPT_*_${STAMP}.tar.gz.sha256" \
              --only-show-errors

            # Keep one week of local copies.
            find "${OUT_DIR}" -name 'siraGPT_*' -type f -mtime +7 -delete

            echo "Volumes backup uploaded: s3://${BACKUP_BUCKET}/volumes/ (stamp ${STAMP})"
