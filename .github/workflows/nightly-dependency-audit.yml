name: Nightly · dependency audit

# PRs that don't touch dependencies skip npm audit (see ci.yml «Did this change
# touch dependencies»). This keeps the advisory feed checked every night against
# the live production-main tree, with the same hard gates and bounded retries.
on:
  schedule:
    - cron: '41 6 * * *'  # daily 06:41 UTC — off-peak, off-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Nightly · npm audit (root + backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production-main
        uses: actions/checkout@v5
        with:
          ref: production-main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit root dependencies
        run: npm run audit:production

      - name: Audit backend dependencies
        run: |
          npm ci --prefix backend --omit=dev --ignore-scripts --no-audit --no-fund
          node backend/scripts/image-size-security-patch.cjs
          node scripts/audit-backend-production.cjs
