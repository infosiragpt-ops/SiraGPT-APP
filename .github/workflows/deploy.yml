name: Verify Lenovo production release

# Application writes run through the reviewed Lenovo publish.sh, not legacy
# VPS secrets. This workflow is read-only and never starts a deployment.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Full production-main commit already published on Lenovo'
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-lenovo-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published SHA and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: production-main
          fetch-depth: 0
      - name: Validate target, successful CI and live release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full lowercase commit SHA is required"; exit 1; }
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/production-main
          runs="$(gh run list --workflow CI --branch production-main --commit "$TARGET_SHA" --limit 20 --json event,conclusion --jq '[.[] | select(.event == "push" and .conclusion == "success")] | length')"
          [[ "$runs" -gt 0 ]] || { echo "::error::Target has no successful production-main push CI"; exit 1; }
          node scripts/verify-lenovo-release.cjs "$TARGET_SHA"
          printf 'Verified Lenovo release: `%s`\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
