name: Docker build images

on:
  push:
    branches: [main, production-main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/Dockerfile
      - services/sandbox/runner/**
      - package.json
      - package-lock.json
      - backend/package.json
      - backend/package-lock.json
      - next.config.mjs
      - docker-compose*.yml
      - .github/workflows/docker-build.yml
  pull_request:
    branches: [production-main]
    paths:
      - backend/Dockerfile
      - backend/scripts/install-spss-runtime.sh
      - backend/scripts/verify-spss-runtime.cjs
      - backend/scripts/verify-spss-artifacts.cjs
      - services/sandbox/runner/**
      - .github/workflows/docker-build.yml
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          tags: siragpt-api:ci
          load: true
          # Speed up: skip healthcheck validation during CI (no DB/Redis).
          build-args: BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

      - name: Build frontend image (no push)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: siragpt-frontend:ci
          load: true

  sandbox-runner:
    name: Docker · document sandbox SPSS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the actual AgentRunner sandbox image
        uses: docker/build-push-action@v7
        with:
          context: services/sandbox/runner
          file: services/sandbox/runner/Dockerfile
          tags: siragpt-doc-sandbox:ci
          load: true

      - name: Reopen a 20 by 20 SAV and Excel in the isolated image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --entrypoint python3 siragpt-doc-sandbox:ci - <<'PY'
          import os, tempfile
          import pandas as pd
          import pyreadstat
          from openpyxl import Workbook, load_workbook

          columns = [f"P{i:02d}" for i in range(1, 21)]
          values = [[row * 100 + col for col in range(20)] for row in range(20)]
          frame = pd.DataFrame(values, columns=columns)
          with tempfile.TemporaryDirectory(dir="/workspace") as directory:
              sav = os.path.join(directory, "muestra.sav")
              xlsx = os.path.join(directory, "muestra.xlsx")
              pyreadstat.write_sav(frame, sav, column_labels={name: f"Pregunta {i}" for i, name in enumerate(columns, 1)})
              workbook = Workbook()
              sheet = workbook.active
              sheet.append(columns)
              for row in values:
                  sheet.append(row)
              workbook.save(xlsx)
              restored, metadata = pyreadstat.read_sav(sav)
              excel = load_workbook(xlsx, read_only=True, data_only=True)
              rows = list(excel.active.values)
              assert restored.shape == (20, 20)
              assert list(restored.columns) == columns
              assert sum(bool(label) for label in (metadata.column_labels or [])) == 20
              assert rows[0] == tuple(columns)
              assert all(tuple(restored.iloc[index]) == tuple(rows[index + 1]) for index in range(20))
          print("SPSS_SANDBOX_IMAGE_OK")
          PY

      - name: Every advertised library, tool and file format works offline
        shell: bash
        run: |
          set -euo pipefail
          # The build already ran both checks as the sandbox user; this repeats
          # them in the isolation production uses (no network, no root) and
          # keeps the per-format log in the job output.
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 siragpt-doc-sandbox:ci /opt/sira/verify_env.py
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python3 siragpt-doc-sandbox:ci /opt/sira/smoke_formats.py /tmp/formats

      - name: Precision toolkit works in the isolated Linux image
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/sandbox-precision-proof"
          mkdir -p "$proof_dir"
          docker image inspect siragpt-doc-sandbox:ci \
            --format 'image_id={{.Id}} os={{.Os}} arch={{.Architecture}}' \
            | tee "$proof_dir/image.txt"
          # Use the built image, not packages installed on the CI host. Both
          # writable directories are bounded tmpfs owned by the runtime user.
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --user 10001:10001 --memory 1g --memory-swap 1g --cpus 1 --pids-limit 256 \
            --tmpfs /tmp:rw,exec,size=256m,uid=10001,gid=10001,mode=1777 \
            --tmpfs /workspace:rw,exec,size=512m,uid=10001,gid=10001,mode=700 \
            --entrypoint python3 siragpt-doc-sandbox:ci \
            /opt/sira/smoke_precision.py /workspace/precision \
            | tee "$proof_dir/results.jsonl"

      - name: Upload precision proof from the built image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-precision-proof
          path: ${{ runner.temp }}/sandbox-precision-proof/
          if-no-files-found: ignore
          retention-days: 7
